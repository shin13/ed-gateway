[project]
name = "ed-gateway"
version = "0.1.0"
description = "Research MVP for AI-assisted emergency-department intake documentation"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.16.5,<2",
  "asyncpg>=0.30.0,<1",
  "chainlit==2.12.0",
  "fastapi>=0.116.1,<1",
  "httpx>=0.28.1,<1",
  "pydantic>=2.11.7,<3",
  "pydantic-settings>=2.10.1,<3",
  "pyyaml>=6.0.2,<7",
  "sqlalchemy[asyncio]>=2.0.43,<3",
  "uvicorn[standard]>=0.35.0,<1",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.21.0,<1",
  "mypy>=1.17.1,<2",
  "pytest>=8.4.1,<9",
  "pytest-asyncio>=1.1.0,<2",
  "ruff>=0.12.11,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ed_gateway"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
  "postgres: requires a running PostgreSQL database",
  "smoke: exercises the running Compose stack",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["ed_gateway"]
