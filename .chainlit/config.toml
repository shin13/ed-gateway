[project]
user_env = []
session_timeout = 3600
user_session_timeout = 1296000
cache = false
persist_user_env = false
mask_user_env = true
allow_origins = ["http://127.0.0.1:8000", "http://localhost:8000"]

[features]
unsafe_allow_html = false
latex = false
user_message_markdown = true
user_message_autoscroll = true
assistant_message_autoscroll = true
auto_tag_thread = false
edit_message = true
allow_thread_sharing = false
favorites = false

[features.slack]
reaction_on_message_received = false

[features.spontaneous_file_upload]
enabled = false
accept = ["text/plain"]
max_files = 0
max_size_mb = 1

[features.audio]
enabled = false
sample_rate = 24000

[features.mcp]
enabled = false

[features.mcp.user_servers]
enabled = false
allowed_urls = []

[UI]
name = "ED Gateway 研究展示"
description = "急診初步資料蒐集與護理師覆核草稿"
default_theme = "light"
confirm_new_chat = true
cot = "hidden"
custom_css = "/public/custom.css"
alert_style = "modern"
logo_file_url = ""
default_avatar_file_url = ""

